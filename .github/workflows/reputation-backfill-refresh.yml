name: Reputation Backfill Refresh

# Producer half of the PhishDestroy reputation backfill loop.
# The freshness supervisor (reputation-backfill-supervisor.yml) is a read-only
# monitor with a 6h TTL; nothing was regenerating data/backfill/reputation_features/
# phishdestroy/latest.json, so the monitor failed on every scheduled run once the
# last hand-committed artifact aged past TTL. This job regenerates and commits the
# artifact on the schedule documented in the artifact's own scheduleManifest,
# 12 minutes ahead of the monitor so the data is always well within TTL.
# Source is a public feed (requiresSecret: false) — no secrets needed.

on:
  schedule:
    - cron: "5 */6 * * *" # 12 min before the supervisor's "17 */6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reputation-backfill-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Refresh PhishDestroy reputation artifact
        run: |
          python scripts/reputation_backfill_worker.py \
            --source phishdestroy_destroylist \
            --live \
            --out data/backfill/reputation_features/phishdestroy/latest.json
      - name: Commit refreshed artifact if changed
        run: |
          set -euo pipefail
          ART=data/backfill/reputation_features/phishdestroy/latest.json
          if git diff --quiet -- "$ART"; then
            echo "No change in $ART; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ART"
          git commit -m "chore: refresh PhishDestroy reputation artifact [skip ci]"
          git push
